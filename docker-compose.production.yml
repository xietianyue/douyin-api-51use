services:
  douyin-api:
    build:
      context: .
    container_name: douyin-api
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "127.0.0.1:9010:9010"
    mem_limit: 1g
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
