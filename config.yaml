# This project deliberately contains no Douyin account cookie.
# The production cookie is supplied through DOUYIN_COOKIE in the server .env file.
TokenManager:
  douyin:
    headers:
      Accept-Language: zh-CN,zh;q=0.8,en;q=0.2
      User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/90.0.4430.212 Safari/537.36
      Referer: https://www.douyin.com/
      Cookie: ""
    proxies:
      http:
      https:
    msToken: {}
    ttwid: {}
